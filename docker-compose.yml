services:
   sqlserver:
      image: mcr.microsoft.com/mssql/server:2022-latest
      environment:
         ACCEPT_EULA: "Y"
         MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      ports:
         - "1433:1433"
      volumes:
         - sql_data:/var/opt/mssql

      healthcheck:
         test:
           [
            "CMD-SHELL",
            "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
           ]
         interval: 10s
         timeout: 5s
         retries: 10
         start_period: 20s

   api:
      build:
         context: .
         dockerfile: Dockerfile
      depends_on:
         sqlserver:
           condition: service_healthy
      ports:
         - 8080:8080 
      environment:
         ASPNETCORE_ENVIRONMENT: "Development"
         ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=DigiLoanDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
         Jwt__Key: "${JWT_KEY}"
         Jwt__Issuer: "DigiLoanApi"
         Jwt__Audience: "DigiLoanClient"
      
volumes:
   sql_data:
          
